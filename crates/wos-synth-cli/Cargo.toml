[package]
name = "wos-synth-cli"
version.workspace = true
edition.workspace = true
publish = false
description = "WOS synthesis host using shared MCP catalog execution and complete native evidence."
license.workspace = true
repository.workspace = true

[[bin]]
name = "wos-synth"
path = "src/main.rs"

[dependencies]
wos-synth-core      = { path = "../wos-synth-core" }
wos-synth-anthropic = { path = "../wos-synth-anthropic" }
wos-synth-mock      = { path = "../wos-synth-mock" }
wos-mcp            = { path = "../wos-mcp" }
wos-authoring      = { path = "../wos-authoring" }
async-trait        = "0.1"
serde              = { version = "1", features = ["derive"] }
clap                = { version = "4", features = ["derive"] }
tokio               = { version = "1", features = ["full"] }
serde_json          = "1"
same-file           = "1"

[dev-dependencies]
tempfile = "3"
wos-lint = { path = "../wos-lint" }
wos-conformance = { path = "../wos-conformance" }
jsonschema = "0.46"
