[package]
name = "wos-runtime"
version.workspace = true
edition.workspace = true
description = "Generic runtime orchestration for WOS processors"
license.workspace = true
repository.workspace = true

[dependencies]
jsonschema = { version = "0.46", default-features = false }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fel-core.workspace = true
integrity-canonical = { path = "../../../integrity-stack/crates/integrity-canonical" }
integrity-cose = { path = "../../../integrity-stack/crates/integrity-cose" }
integrity-signature = { path = "../../../integrity-stack/crates/integrity-signature" }
integrity-signature-ring = { path = "../../../integrity-stack/crates/integrity-signature-ring" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
stack-common-http.workspace = true
stack-common-hash.workspace = true
stack-common-typeid.workspace = true
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
trellis-service-client.workspace = true
trellis-types.workspace = true
ureq = { version = "3", features = ["json"] }
wos-core = { path = "../wos-core" }
wos-events = { path = "../wos-events" }

[dev-dependencies]
wos-formspec-binding = { path = "../wos-formspec-binding" }
ring = "0.17"
axum = "0.8"
integrity-bundle = { path = "../../../integrity-stack/crates/integrity-bundle" }
integrity-cbor = { path = "../../../integrity-stack/crates/integrity-cbor" }
jsonschema = "0.46"
stack-common-error = { path = "../../../stack-common/crates/stack-common-error", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
trellis-export-writer = { path = "../../../trellis/crates/trellis-export-writer" }
trellis-server = { path = "../../../trellis/crates/trellis-server", features = ["test-harness"] }
trellis-verify-wos = { path = "../../../trellis/crates/trellis-verify-wos" }
